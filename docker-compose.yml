version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: green_retrofit_backend
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost
    ports:
      - "8000:8000"
    restart: always
    # 메모리 제한 설정 (선택 사항, AWS 1GB 환경 보호용)
    deploy:
      resources:
        limits:
          memory: 800M

  frontend:
    build:
      context: ./green-retrofit-frontend
      dockerfile: Dockerfile.frontend
    container_name: green_retrofit_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
